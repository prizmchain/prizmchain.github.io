<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-itunes-app" content="app-id=6761184037">
  <title>Join me on IslandMates</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f7f0e8; color: #4a3d35; }
    main { width: min(100%, 390px); text-align: center; padding: 36px 24px; border: 1px solid rgba(255,255,255,.85); border-radius: 28px; background: rgba(255,255,255,.62); box-shadow: 0 18px 50px rgba(120,88,66,.12); }
    .island { font-size: 64px; }
    h1 { margin: 14px 0 8px; font-size: 28px; letter-spacing: -.6px; }
    p { margin: 0 0 22px; color: #8f7e74; line-height: 1.5; }
    .code { margin: 20px 0; padding: 16px; border-radius: 18px; background: #fff8fa; color: #ff6f98; font-size: 34px; font-weight: 800; letter-spacing: 7px; }
    a, button { display: block; width: 100%; margin-top: 12px; padding: 15px 18px; border: 0; border-radius: 16px; font: inherit; font-weight: 750; text-decoration: none; cursor: pointer; }
    .open { background: #ff8fab; color: white; }
    .store { background: #4a3d35; color: white; }
    button { background: transparent; color: #8f7e74; }
    small { display: block; margin-top: 20px; color: #aa9b92; line-height: 1.45; }
  </style>
</head>
<body>
  <main>
    <div class="island" aria-hidden="true">🏝️</div>
    <h1>Raise our pet together</h1>
    <p>Open IslandMates and join our shared room.</p>
    <div class="code" id="room-code" aria-label="Room code"></div>
    <a class="open" id="open-app" href="#">Open IslandMates</a>
    <a class="store" href="https://apps.apple.com/app/id6761184037">Download on the App Store</a>
    <button id="copy-code" type="button">Copy room code</button>
    <small>If the app was just installed, return here and tap “Open IslandMates,” or enter the code manually.</small>
  </main>
  <script>
    const rawCode = new URLSearchParams(location.search).get('code') || '';
    const code = /^\d{6}$/.test(rawCode) ? rawCode : '------';
    const deepLink = code === '------' ? 'islandmates://join' : `islandmates://join?code=${code}`;
    document.getElementById('room-code').textContent = code;
    document.getElementById('open-app').href = deepLink;
    document.getElementById('copy-code').addEventListener('click', async () => {
      if (code === '------') return;
      await navigator.clipboard.writeText(code);
      document.getElementById('copy-code').textContent = 'Copied';
    });
  </script>
</body>
</html>
